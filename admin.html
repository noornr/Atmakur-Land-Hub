<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="admin-container">

<h2>Add New Property</h2>

<input type="text" id="property_id" placeholder="Property ID">

<input type="text" id="price" placeholder="Price">

<input type="text" id="area" placeholder="Area">

<input type="text" id="area_telugu" placeholder="Area Telugu">

<input type="text" id="land" placeholder="Land">

<input type="text" id="land_telugu" placeholder="Land Telugu">

<input type="text" id="facing" placeholder="Facing">

<input type="text" id="facing_telugu" placeholder="Facing Telugu">

<input type="text" id="road" placeholder="Road">

<input type="text" id="road_telugu" placeholder="Road Telugu">

<textarea id="description" placeholder="Description"></textarea>

<textarea id="description_telugu" placeholder="Description Telugu"></textarea>

<select id="status">
    <option value="AVAILABLE">AVAILABLE</option>
    <option value="SOLD">SOLD</option>
</select>
<input type="text" id="map" placeholder="Google Maps Link">

<input type="text" id="images" placeholder="property1.jpg">

<label>
<input type="checkbox" id="featured">
Featured Property
</label>

<button onclick="addProperty()">
Save Property
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
    <script src="admin.js"></script>

</body>

</html>
