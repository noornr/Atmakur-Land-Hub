
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Favorite Properties</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <h2>❤️ My Favorite Properties</h2>

</header>

<section
    class="property-grid"
    id="favoritesContainer"
    style="padding-top:120px;">
</section>

<script src="script.js"></script>

<script>

const favorites =
JSON.parse(localStorage.getItem("favorites")) || [];

const container =
document.getElementById("favoritesContainer");

if(favorites.length===0){

container.innerHTML = `

<div class="empty-favorites">

    <div class="empty-icon">❤️</div>

    <h2>No Favorite Properties</h2>

    <p>
        Save your favorite properties using the
        <strong>❤️ Favorite</strong> button.
    </p>

    <a href="index.html" class="details-btn">
        🏠 Back Home
    </a>

</div>

`;

else{

const propertyData={

"ATK-1":{
image:"images/property1.jpg",
title:"Minority Colony",
price:"₹7,50,000",
status:"AVAILABLE"
},

"ATK-2":{
image:"images/property2.jpg",
title:"Nandyala Road Highway Side",
price:"1 Cent ₹4,50,000",
status:"SOLD"
},

"ATK-3":{
image:"images/property3.jpg",
title:"Minority Colony",
price:"₹7,50,000",
status:"AVAILABLE"
},

"ATK-4":{
image:"images/property4.jpg",
title:"Minority Colony",
price:"₹7,50,000",
status:"AVAILABLE"
},

"ATK-5":{
image:"images/property5.jpg",
title:"Minority Colony",
price:"₹7,50,000",
status:"AVAILABLE"
},

"ATK-6":{
image:"images/property6.jpg",
title:"Minority Colony",
price:"₹7,50,000",
status:"AVAILABLE"
}

};

favorites.forEach(id=>{

const p=propertyData[id];

if(!p)return;

container.innerHTML+=`

<div class="card">

<div class="card-image">

<img src="${p.image}" alt="${id}">

<span class="badge ${p.status==="SOLD"?"sold":"available"}">

${p.status}

</span>

</div>

<div class="card-content">

<h3>${id}</h3>

<p>📍 ${p.title}</p>

<p class="price">${p.price}</p>

<a href="property${id.replace("ATK-","")}.html"
class="details-btn">

View Property

</a>

</div>

</div>

`;

});

}

</script>

</body>

</html>
