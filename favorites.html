<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Favorite Properties</title>

<link rel="stylesheet" href="favorites.css">

</head>

<body>

    <header class="navbar">
    <h2>❤️ My Favorite Properties</h2>
    </header>

<section class="property-grid" id="favoritesContainer">
</section>

<script src="properties.js"></script>
<script src="script.js"></script>

<script>

const favorites =
JSON.parse(localStorage.getItem("favorites")) || [];

const container =
document.getElementById("favoritesContainer");

if (favorites.length === 0) {

container.classList.add("empty-state");
    
container.innerHTML=`

<div class="empty-favorites">

<div class="empty-icon">❤️</div>

<h2>No Favorite Properties</h2>

<p>

Save your favorite properties using the
<strong>❤️ Favorite</strong> button.

</p>

<a href="index.html" class="details-btn">

🏠 Back Home

</a>

</div>

`;

}else{

favorites.forEach(id=>{

const p = properties[id];

if(!p) return;

container.innerHTML += `

<div class="card">

<div class="card-image">

<img src="${p.images[0]}" alt="${p.id}">

<span class="badge ${p.status.toLowerCase()}">

${p.status}

</span>

</div>

<div class="card-content">

<h3>ID: ${p.id}</h3>

<p>📍 ${p.area}</p>

<p>📍 ${p.areaTelugu}</p>

<p>📐 ${p.land} / ${p.landTelugu}</p>

<p>⤴️ ${p.facing} / ${p.facingTelugu}</p>

<p class="price">${p.price}</p>

<div class="card-buttons">

<a href="property.html?id=${p.id}" class="details-btn">

View Details

</a>

<a href="https://wa.me/918977201211"
class="whatsapp-btn">

WhatsApp

</a>

</div>

</div>

</div>

`;

});

}

</script>

</body>
</html>
