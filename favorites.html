
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Favorite Properties</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <h2>❤️ My Favorite Properties</h2>

</header>

<section class="property-grid" id="favoritesContainer">

</section>

<script src="script.js"></script>

<script>

const favorites =
JSON.parse(localStorage.getItem("favorites")) || [];

const container =
document.getElementById("favoritesContainer");

if(favorites.length===0){

container.innerHTML = `

<div class="empty-favorites">

    <div class="empty-icon">❤️</div>

    <h2>No Favorite Properties</h2>

    <p>
        Save your favorite properties using the
        <strong>❤️ Favorite</strong> button.
    </p>

    <a href="index.html" class="details-btn">
        🏠 Back Home
    </a>

</div>

`;

}else{

favorites.forEach(id=>{

container.innerHTML+=`

<div class="card">

<div class="card-content">

<h3>${id}</h3>

<p>This property is saved.</p>

<a href="property${id.replace("ATK-","")}.html"
class="details-btn">

View Property

</a>

</div>

</div>

`;

});

}

</script>

</body>

</html>
