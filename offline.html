<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Internet</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}
.box{
    max-width:320px;
}
h1{
    color:#FFD700;
}
button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    background:#FFD700;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
    <h1>No Internet</h1>
    <p>Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
</div>

</body>
</html>
